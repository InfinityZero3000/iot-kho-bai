<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho bãi - Dashboard</title>
<style>
  :root {
    --primary: #044f9e; --primary-ink: #fff;
    --bg: #f3f6fa; --card: #fff; --ink: #1f2a37; --muted: #5b6776; --line: #dbe3ec;
    --on: #fec01d; --on-ink: #1f2a37; --off: #e7e6e6;
    --ok: #1a7f37; --err: #c62828;
    --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1720; --card: #17212c; --ink: #e8edf3; --muted: #9aa7b5; --line: #2a3745;
            --off: #2a3441; --primary: #4c9bf0; --primary-ink: #0f1720; --ok: #4cc26b; --err: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: var(--s4) var(--s3); }
  header { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; justify-content: space-between; margin-bottom: var(--s4); }
  h1 { font-size: 1.5rem; margin: 0; }
  .status { display: flex; gap: var(--s3); flex-wrap: wrap; font-size: .875rem; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--err); margin-right: var(--s2); }
  .dot.ok { background: var(--ok); }
  .grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .zone { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: var(--s3); transition: background .25s, border-color .25s; }
  .zone.on { background: var(--on); border-color: var(--on); color: var(--on-ink); }
  .zone h2 { margin: 0 0 var(--s2); font-size: 1.125rem; }
  .lamp { font-size: 1.75rem; font-weight: 700; margin-bottom: var(--s2); }
  .row { display: flex; justify-content: space-between; font-size: .875rem; margin-bottom: var(--s3); }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  button { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
           font: inherit; font-weight: 600; cursor: pointer; transition: transform .15s, background .15s; }
  button:hover { background: var(--bg); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  details { margin-top: var(--s4); }
  summary { cursor: pointer; color: var(--muted); }
  label { display: block; margin: var(--s2) 0; font-size: .875rem; }
  input { padding: var(--s2); border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; width: min(100%, 320px); }
  #log { margin: var(--s3) 0 0; padding: var(--s3); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         font: .8125rem/1.6 ui-monospace, monospace; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Chiếu sáng kho bãi theo khu vực</h1>
    <div class="status" aria-live="polite">
      <span><span class="dot" id="brokerDot"></span><span id="brokerTxt">Đang kết nối broker...</span></span>
      <span><span class="dot" id="espDot"></span><span id="espTxt">ESP32: chưa rõ</span></span>
    </div>
  </header>

  <section class="grid" id="zones" aria-label="Các phân khu"></section>

  <details>
    <summary>Cài đặt kết nối</summary>
    <label>Tiền tố topic (phải trùng PREFIX trong main.cpp)
      <input id="prefix" value="huit-khobai-nht" autocomplete="off">
    </label>
    <button id="reconnect" type="button">Kết nối lại</button>
  </details>

  <pre id="log" aria-label="Nhật ký"></pre>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";  // cùng broker với main.cpp, qua WebSocket
const MODES = ["AUTO", "ON", "OFF"];
const $ = (id) => document.getElementById(id);
const state = [0, 1, 2].map(() => ({ lamp: null, pir: null, mode: null }));
let client, prefix;

const zonesEl = $("zones");
state.forEach((_, i) => {
  zonesEl.insertAdjacentHTML("beforeend", `
    <article class="zone" id="z${i}">
      <h2>Phân khu ${i + 1}</h2>
      <div class="lamp" id="lamp${i}">--</div>
      <div class="row"><span>Cảm biến PIR</span><strong id="pir${i}">--</strong></div>
      <div class="modes" role="group" aria-label="Chế độ khu ${i + 1}">
        ${MODES.map((m) => `<button type="button" data-z="${i}" data-m="${m}" aria-pressed="false" disabled>${m === "AUTO" ? "Tự động" : m === "ON" ? "Bật" : "Tắt"}</button>`).join("")}
      </div>
    </article>`);
});

function log(msg) {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function render(i) {
  const s = state[i], on = s.lamp === "ON";
  $("z" + i).classList.toggle("on", on);
  $("lamp" + i).textContent = s.lamp === null ? "--" : on ? "ĐÈN SÁNG" : "ĐÈN TẮT";
  $("pir" + i).textContent = s.pir === null ? "--" : s.pir === "1" ? "Có chuyển động" : "Không có";
  document.querySelectorAll(`button[data-z="${i}"]`).forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.m === s.mode));
  });
}

function setLink(dot, txt, ok, text) {
  $(dot).classList.toggle("ok", ok);
  $(txt).textContent = text;
  if (dot === "brokerDot") document.querySelectorAll(".modes button").forEach((b) => (b.disabled = !ok));
}

function connect() {
  if (client) client.end(true);
  prefix = $("prefix").value.trim();
  state.forEach((s, i) => { s.lamp = s.pir = s.mode = null; render(i); });
  setLink("brokerDot", "brokerTxt", false, "Đang kết nối broker...");
  client = mqtt.connect(BROKER, { reconnectPeriod: 3000 });
  client.on("connect", () => {
    setLink("brokerDot", "brokerTxt", true, "Broker: đã kết nối");
    client.subscribe(`${prefix}/#`);
    log("Đã kết nối, đang theo dõi " + prefix + "/#");
  });
  client.on("close", () => setLink("brokerDot", "brokerTxt", false, "Broker: mất kết nối"));
  client.on("error", (e) => log("Lỗi: " + e.message));
  client.on("message", (topic, buf) => {
    const val = buf.toString(), rest = topic.slice(prefix.length + 1);
    if (rest === "trangthai") {
      setLink("espDot", "espTxt", val === "online", "ESP32: " + val);
    } else {
      const m = rest.match(/^khu([1-3])\/(pir|den|chedo)$/);
      if (!m) return;
      const i = m[1] - 1, key = { pir: "pir", den: "lamp", chedo: "mode" }[m[2]];
      state[i][key] = val;
      render(i);
    }
    log(`${rest} = ${val}`);
  });
}

zonesEl.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-m]");
  if (!b || !client || !client.connected) return;
  client.publish(`${prefix}/khu${+b.dataset.z + 1}/lenh`, b.dataset.m);
  log(`Gửi lệnh khu ${+b.dataset.z + 1}: ${b.dataset.m}`);
});
$("reconnect").addEventListener("click", connect);
connect();
</script>
</body>
</html>
